<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <title>OCI VM Manager — Dashboard</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body class="dashboard-page">
  <header class="header">
    <h1>OCI VM Manager</h1>
    <div class="header-actions">
      <span id="userEmail" class="muted"></span>
      <button id="btnLogout" class="btn btn-ghost">Cerrar sesión</button>
    </div>
  </header>
  <div id="modalDelete" class="modal hidden">
    <div class="modal-backdrop" data-dismiss></div>
    <div class="modal-content">
      <h3>¿Eliminar dominio?</h3>
      <p id="modalDeleteText" class="muted"></p>
      <div class="form-group">
        <label>Escribí <strong id="modalDeleteDomain"></strong> para confirmar</label>
        <input type="text" id="modalDeleteConfirm" placeholder="dominio.ejemplo.com" autocomplete="off">
      </div>
      <div class="modal-error hidden" id="modalDeleteError"></div>
      <div class="modal-actions">
        <button type="button" class="btn btn-ghost" data-dismiss>Cancelar</button>
        <button type="button" class="btn btn-danger" id="modalDeleteBtn">Eliminar</button>
      </div>
    </div>
  </div>
  <main class="main">
    <section class="card">
      <h2>Dominios y puertos</h2>
      <p class="muted">Cada dominio apunta a un puerto local. Si activás "Redirigir www", las visitas a www.dominio.com van a dominio.com.</p>
      <div id="sitesList"></div>
      <button id="btnAddSite" class="btn btn-secondary" type="button">+ Agregar dominio</button>
      <div class="actions" style="margin-top: 1.5rem;">
        <button id="btnSave" class="btn btn-secondary">Guardar</button>
        <button id="btnDeploy" class="btn btn-primary">Desplegar a VM</button>
      </div>
      <div id="msg" class="msg hidden"></div>
    </section>
    <section class="card card-muted">
      <h3>Vista previa (Caddyfile generado)</h3>
      <pre id="caddyPreview"></pre>
    </section>
  </main>
  <footer class="footer">
    Hecho por <a href="https://github.com/jmalbarra" target="_blank" rel="noopener noreferrer">jmalbarra</a>
  </footer>
  <script src="/js/dashboard.js"></script>
</body>
</html>
