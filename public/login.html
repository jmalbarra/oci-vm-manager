<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <title>OCI VM Manager — Login</title>
  <link rel="stylesheet" href="/css/style.css">
  <script src="/js/theme.js"></script>
</head>
<body class="login-page">
  <div class="login-wrap">
    <button type="button" id="themeToggle" class="theme-toggle" title="Cambiar tema" style="position: absolute; top: 1rem; right: 1rem;">🌙</button>
    <div class="login-card">
    <h1>OCI VM Manager</h1>
    <p>Administración de la VM compartida</p>
    <div id="loginForm">
      <div id="loginStep">
        <div class="form-group">
          <label>Email</label>
          <input type="email" id="loginEmail" name="email" required placeholder="admin@ejemplo.com" autocomplete="email">
        </div>
        <div class="form-group">
          <label>Contraseña</label>
          <input type="password" id="loginPassword" name="password" required placeholder="••••••••" autocomplete="current-password">
        </div>
        <div id="loginError" class="error hidden"></div>
        <button type="button" id="btnEntrar" class="btn btn-primary">Entrar</button>
      </div>
      <div id="tfaStep" class="hidden">
        <p class="muted" style="margin-bottom: 1rem;">Ingresá el código de 6 dígitos de tu app de autenticación</p>
        <div class="form-group">
          <label>Código 2FA</label>
          <input type="text" id="tfaCode" inputmode="numeric" pattern="[0-9]*" maxlength="8" placeholder="000000" autocomplete="one-time-code">
        </div>
        <div id="tfaError" class="error hidden"></div>
        <button type="button" id="btnTfaVerify" class="btn btn-primary">Verificar</button>
        <button type="button" id="btnTfaBack" class="btn btn-ghost" style="margin-left: 0.5rem;">Volver</button>
      </div>
    </div>
    </div>
    <footer class="footer">
      Hecho por <a href="https://github.com/jmalbarra" target="_blank" rel="noopener noreferrer">jmalbarra</a>
    </footer>
  </div>
  <script src="/js/login.js"></script>
</body>
</html>
