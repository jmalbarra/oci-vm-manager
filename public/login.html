<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <title>OCI VM Manager — Login</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body class="login-page">
  <div class="login-card">
    <h1>OCI VM Manager</h1>
    <p>Administración de la VM compartida</p>
    <form id="loginForm">
      <div class="form-group">
        <label>Email</label>
        <input type="email" name="email" required placeholder="admin@ejemplo.com">
      </div>
      <div class="form-group">
        <label>Contraseña</label>
        <input type="password" name="password" required placeholder="••••••••">
      </div>
      <div id="loginError" class="error hidden"></div>
      <button type="submit" class="btn btn-primary">Entrar</button>
    </form>
  </div>
  <script>
    // Solo redirigir si hay sesión válida; evita bucle cuando sessionStorage dice "authed" pero el servidor ya expiró
    fetch('/api/me').then(r => { if (r.ok) location.replace('/'); });
    document.getElementById('loginForm').onsubmit = async (e) => {
      e.preventDefault();
      const err = document.getElementById('loginError');
      err.classList.add('hidden');
      const fd = new FormData(e.target);
      try {
        const res = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email: fd.get('email'), password: fd.get('password') })
        });
        let data = {};
        try { data = await res.json(); } catch (_) { data = { error: 'Respuesta inválida del servidor' }; }
        if (!res.ok) {
          err.textContent = data.error || (res.status === 429 ? 'Demasiados intentos. Esperá 15 min.' : 'Credenciales inválidas');
          err.classList.remove('hidden');
          return;
        }
        sessionStorage.setItem('oci-vm-authed', '1');
        location.replace('/');
      } catch (e) {
        err.textContent = 'Error de conexión. Revisá la red e intentá de nuevo.';
        err.classList.remove('hidden');
      }
    };
  </script>
</body>
</html>
