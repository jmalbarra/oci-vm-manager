name: Deploy to OCI

# Deploy oci-vm-manager al servidor compartido al mergear PR a main.
# Secrets requeridos: SSH_PRIVATE_KEY, SERVER_IP (mismo servidor que turnero)
#
# Si cambiás .env en el servidor manualmente, reiniciá pm2 para que tome los cambios:
#   pm2 restart oci-vm-manager

on:
  push:
    branches: [main, master]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H ${{ secrets.SERVER_IP }} >> ~/.ssh/known_hosts

      - name: Deploy code
        run: |
          rsync -avz --delete \
            --exclude 'node_modules' --exclude '.env' --exclude '.git' \
            --exclude 'config/sites.json' --exclude 'config/Caddyfile' \
            --exclude 'config/tfa.json' --exclude 'config/security.log' --exclude 'config/backups' \
            -e "ssh -i ~/.ssh/id_ed25519" \
            ./ ubuntu@${{ secrets.SERVER_IP }}:/opt/oci-vm-manager/

      - name: Install and restart
        run: |
          ssh -i ~/.ssh/id_ed25519 ubuntu@${{ secrets.SERVER_IP }} << 'EOF'
            set -e
            cd /opt/oci-vm-manager
            npm install --omit=dev
            pm2 restart oci-vm-manager --update-env
          EOF
